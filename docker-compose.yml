version: "3.9"
services:
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: freecloudbot/backend:dev
    container_name: freecloudbot
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data

